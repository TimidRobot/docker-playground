name: prek checks
on: [push, pull_request]

env:
  # hadolint v2.15.1
  HADOLINT_DOWNLOAD: https://github.com/hadolint/hadolint/releases/download/
  HADOLINT_VERSION: v2.15.1/hadolint-linux-x86_64
  HADOLINT_SHA256: >-
    c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  # prek v3.0.1
  PREK_VERSION: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/hadolint/hadolint
      - name: Download hadolint v2.15.1
        run: |
          wget --tries=3 --output-document=/usr/local/bin/hadolint --continue \
            --progress=dot:mega $HADOLINT_DOWNLOAD$HADOLINT_VERSION
          echo "$HADOLINT_SHA256 /usr/local/bin/hadolint" \
             > hadolint-linux-x86_64_sha256checksum
          sha256sum --check hadolint-linux-x86_64_sha256checksum
          chmod 0755 /usr/local/bin/hadolint
      # https://github.com/koalaman/shellcheck
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install shellcheck
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # https://github.com/j178/prek-action
      # path 1
      - name: 'On merge: run prek without no-commit-to-branch'
        if: ${{ github.event.pull_request.merged }}
        uses: ${{ env.PREK_VERSION }}
        with:
          extra-args: --skip no-commit-to-branch
      # path 2
      - name: 'Not on merge: run prek with no-commit-to-branch'
        if: ${{ ! github.event.pull_request.merged }}
        uses: ${{ env.PREK_VERSION }}
