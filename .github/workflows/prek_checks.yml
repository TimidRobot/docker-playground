name: prek checks
on: [push, pull_request]

env:
  HADOLINT_DOWNLOAD: https://github.com/hadolint/hadolint/releases/download/
  # hadolint v2.15.1
  HADOLINT_VERSION: v2.15.1/hadolint-linux-x86_64
  HADOLINT_SHA256: >-
    c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - parallel:
        # https://github.com/hadolint/hadolint
        - name: Install hadolint v2.15.1
          run: |
            wget --tries=3 --output-document=/usr/local/bin/hadolint \
              --continue --progress=dot:mega \
              $HADOLINT_DOWNLOAD$HADOLINT_VERSION
            echo "$HADOLINT_SHA256 /usr/local/bin/hadolint" \
               > hadolint-linux-x86_64_sha256checksum
            sha256sum --check hadolint-linux-x86_64_sha256checksum
            chmod 0755 /usr/local/bin/hadolint
        # https://github.com/koalaman/shellcheck
        - name: Install shellcheck
          run: |
            sudo apt-get update
            sudo apt-get install shellcheck
        # https://github.com/actions/checkout
        - name: Checkout repository
          # v7.0.1
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # https://github.com/j178/prek-action
        - name: Install prek
          # v3.0.1
          uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204
          with:
            install-only: true
      # https://stackoverflow.com/a/75237344
      - name:
        if: ${{ github.event.pull_request.merged }}
        run: echo 'PREK_SKIP=no-commit-to-branch' >> $GITHUB_ENV
      - name: 'Run prek'
        run: prek run --show-diff-on-failure --color=always
